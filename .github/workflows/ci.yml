name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Require forward-only migrations
        run: |
          test -d supabase/migrations
          find supabase/migrations -type f -name '*.sql' -print | sort | uniq -d | (! grep .)
      - name: Scan tracked secrets
        uses: gitleaks/gitleaks-action@v2
